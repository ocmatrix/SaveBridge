[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64

# PR-9 testnet-fast variant (generated by `node scripts/make-fast-variant.mjs`; never committed, never mainnet).
# Usage: FOUNDRY_PROFILE=fast forge test   — the default profile above is unchanged.
[profile.fast]
src = "contracts/testnet-fast/src"
test = "contracts/testnet-fast/test"
script = "contracts/testnet-fast/script"
out = "out-fast"
cache_path = "cache-fast"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.fast.fuzz]
runs = 512

[profile.fast.invariant]
runs = 256
depth = 64
