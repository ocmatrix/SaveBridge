# Cloudflare Workers Static Assets site for admin.wanto.pro (Qbit account, Worker "savebridge-admin"; DESIGN §8).
# The custom domain admin.wanto.pro is already attached to this Worker in the dashboard (placeholder page), so no
# `routes` here: a deploy keeps it. workers.dev stays closed.
# Deploy (owner-authorised): pnpm -C apps/admin-web build:prod && pnpm -C apps/admin-web exec wrangler deploy
# The app uses History API paths (/handover, /emergency, ...): single-page-application fallback is required.
# Cloudflare Access (optional "privacy shield", not the security boundary, DESIGN §8.4): admin.wanto.pro/* except /handover.
name = "savebridge-admin"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
