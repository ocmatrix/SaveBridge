# Cloudflare Pages project "safebridge-admin" (Qbit account): static dist/ + the Pages Function in functions/
# (POST /api/whitelist = one-signature whitelist submission, see functions/_lib/submit.ts).
# Deploy (owner-authorised): pnpm -C apps/admin-web build:prod && cd apps/admin-web && wrangler pages deploy dist --project-name safebridge-admin --branch main
# Secret (never in this file): wrangler pages secret put SUBMITTER_KEY --project-name safebridge-admin   (gas-only key, no contract role)
name = "safebridge-admin"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

[vars]
BRIDGE = "0x41e9900BF09553C46b6b3F267626FDa2b4711E44"
BSC_CHAIN_ID = "56"
BSC_RPC_URL = "https://bsc-rpc.publicnode.com"
# Tried in order when the primary answers 429 (publicnode rate-limits Cloudflare's shared egress IPs). Public URLs only, no keys.
BSC_RPC_FALLBACKS = "https://rpc-bsc.48.club,https://bsc-dataseed.bnbchain.org,https://bsc-dataseed1.defibit.io"
WANTOS_CHAIN_ID = "13555"
WANTOS_RPC_URL = "https://rpc3.wantos.io"
ALLOWED_ORIGINS = "https://admin.wanto.pro,https://safebridge-admin.pages.dev"
